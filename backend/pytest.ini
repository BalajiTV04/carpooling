[pytest]
# Test layout: tests/ holds one file per module (test_<module>.py).
testpaths = tests
# Module 3 auth uses async routes; strict mode makes an unmarked coroutine a
# hard error instead of a silent skip.
asyncio_mode = strict
filterwarnings =
    error
    # starlette's TestClient runs the app on a portal thread; on Python 3.8 /
    # Windows the portal loop raises "set_wakeup_fd only works in main thread"
    # when it is garbage-collected. Cosmetic and outside our code (Module 20's
    # WebSocket test is the only user of TestClient).
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning:passlib.*
