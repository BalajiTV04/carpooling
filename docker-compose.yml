# DEVELOPMENT compose (Module 1): live reload, dev secrets, Mongo port open to
# localhost so you can inspect it with Compass / mongosh.
# For anything deployed, use docker-compose.prod.yml instead.
services:
  mongo:
    image: mongo:7
    container_name: ivs-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vehicle_sharing_dev

  backend:
    build: ./backend
    container_name: ivs-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: ivs-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  mongo-data:
